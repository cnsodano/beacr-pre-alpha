url: https://github.com/cnsodano/beacr-pre-alpha/
template:
  bootstrap: 5
  includes:
  in_header: |
      <link rel="stylesheet" type="text/css" href="pkgdown/extra.css" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
      <style>
        .img-breakout {
          width: 100vw;
          max-width: 100vw;
          margin-left: calc(50% - 50vw);
          margin-right: calc(50% - 50vw);
          display: block;
        }
        .img-breakout img {
          width: 100%;
          height: auto;
          display: block;
        }
      </style>
  before_body: |
      <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
      <script>
        document.addEventListener('DOMContentLoaded', function() {
          GLightbox({ selector: '.glightbox' });
        });
      </script>
  light-switch: true
  bslib:
    bootswatch: cosmo
    fg: "#3d5a80"
    bg: "#f9f5ff"
    white: "#f9f5ff"
    black: "#3d5a80"
    primary: "#3d5a80"



reference:
  - title: "Core Functions"
    desc: "Primary functions for doing the main thing"
  - contents:
      - get_seed
      - reset_seed_log
  - title: "Public Utilities"
    desc: "Utilities that may be useful for everyday use of the package, not only for developers"
  - contents:
      - read_logs
      - verify_log
  - title: "Beacons"
    desc: "Currently available Beacon implementations"
  - contents:
    - BeaconInterface
    - NISTBeacon
  - title: "Internal"
    desc: "Internal functions for developers"
  - contents:
      - has_keyword("internal")
      - starts_with("\\.")
  - title: "All internal & external names alphabetically"
  - contents:
    - matches(".")

